name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check reference-audit-v30.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check figure-apa.js
          node --check exclude-banner-v342.js
          node --check docx-figure-export-v2.js

      - name: Verify v3.4.2 figures, banner exclusion and APA safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f pdf-original-media-v33.js
          test -f table-figure-v32.js
          test -f list-normalizer-v31.js
          test -f scrollbar-v31.css
          test -f figure-apa.js
          test -f exclude-banner-v342.js
          test -f docx-figure-export-v2.js
          grep -q 'PDF_ORIGINAL_MEDIA_VERSION = "3.4"' pdf-original-media-v33.js
          grep -q 'module-banner-image' pdf-original-media-v33.js
          grep -q 'apaSelfCaptioned' pdf-original-media-v33.js
          grep -q 'standaloneFigureLabel' pdf-original-media-v33.js
          grep -q 'previousPageTail' pdf-original-media-v33.js
          grep -q 'window.repairApaMediaRoles' pdf-original-media-v33.js
          grep -q 'FIGURE_APA_VERSION = "3.4.1"' figure-apa.js
          grep -q 'BANNER_EXCLUDE_VERSION = "3.4.2"' exclude-banner-v342.js
          grep -q 'excludeModuleStartBanner' exclude-banner-v342.js
          grep -q 'img.remove()' exclude-banner-v342.js
          grep -q 'DOCX_FIGURE_EXPORT_VERSION = "3.4.1"' docx-figure-export-v2.js
          grep -q 'module-banner-image' figure-apa.js
          grep -q 'apaSelfCaptioned' figure-apa.js
          grep -q 'apa-figure-label' figure-apa.js
          grep -q 'insideVertical: none' docx-figure-export-v2.js
          grep -q 'exclude-banner-v342.js' html-enhance.js
          grep -q 'figure-apa.js' html-enhance.js
          grep -q 'docx-figure-export-v2.js' html-enhance.js
          grep -q 'HTML_ENHANCE_VERSION = "3.4.2"' html-enhance.js
          grep -q 'APA_LIST_VERSION = "3.1"' list-normalizer-v31.js
          grep -q 'max-height: 72vh' scrollbar-v31.css
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.2 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Base v3.4 con figuras APA 7 y sin reorganizar el módulo." >> "$GITHUB_STEP_SUMMARY"
          echo "El banner inicial se excluye completamente de la vista formateada y de las exportaciones." >> "$GITHUB_STEP_SUMMARY"
          echo "Las figuras académicas se conservan; las auto-rotuladas no duplican captions y las demás reciben Figura X, título y Nota cuando corresponda." >> "$GITHUB_STEP_SUMMARY"
          echo "El exportador DOCX mantiene el orden actual de la vista previa, tablas APA y listas independientes." >> "$GITHUB_STEP_SUMMARY"
