name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check reference-audit-v30.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check source-images-v345.js
          node --check figure-apa.js
          node --check exclude-banner-v343.js
          node --check image-editor-v344.js
          node --check reference-format-v345.js
          node --check docx-figure-export-v2.js
          node --check docx-banner-safe-v343.js

      - name: Verify v3.4.5 source images and APA references
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f source-images-v345.js
          test -f pdf-original-media-v33.js
          test -f figure-apa.js
          test -f exclude-banner-v343.js
          test -f image-editor-v344.js
          test -f reference-format-v345.js
          test -f docx-figure-export-v2.js
          test -f docx-banner-safe-v343.js
          grep -q 'SOURCE_IMAGES_VERSION = "3.4.5"' source-images-v345.js
          grep -q 'mammoth.images.imgElement' source-images-v345.js
          grep -q 'image.read("base64")' source-images-v345.js
          grep -q 'hoistEmbeddedImage' source-images-v345.js
          grep -q 'apaLoadedDocumentImage' source-images-v345.js
          grep -q 'PDF_ORIGINAL_MEDIA_VERSION = "3.4"' pdf-original-media-v33.js
          grep -q 'apaMediaRole = "module-banner"' pdf-original-media-v33.js
          grep -q 'IMAGE_EDITOR_VERSION = "3.4.4"' image-editor-v344.js
          grep -q 'insertApaImage' image-editor-v344.js
          grep -q 'REFERENCE_FORMAT_VERSION = "3.4.5"' reference-format-v345.js
          grep -q 'paddingLeft = ".5in"' reference-format-v345.js
          grep -q 'textIndent = "-.5in"' reference-format-v345.js
          grep -q 'lineHeight = "2"' reference-format-v345.js
          grep -q 'https://doi.org/' reference-format-v345.js
          grep -q 'sortReferenceNodes' reference-format-v345.js
          grep -q 'DOCX_BANNER_SAFE_VERSION = "3.4.5"' docx-banner-safe-v343.js
          grep -q 'classifyEmbeddedImages' docx-banner-safe-v343.js
          grep -q 'formatReferencesApa7' docx-banner-safe-v343.js
          grep -q 'source-images-v345.js' html-enhance.js
          grep -q 'reference-format-v345.js' html-enhance.js
          grep -q 'HTML_ENHANCE_VERSION = "3.4.5"' html-enhance.js
          grep -q 'APA_LIST_VERSION = "3.1"' list-normalizer-v31.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.5 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Las imágenes incrustadas en documentos DOCX se preservan como datos de imagen y se incorporan al documento editable/exportable." >> "$GITHUB_STEP_SUMMARY"
          echo "Las figuras recuperadas de PDF y las imágenes insertadas manualmente continúan disponibles; solo el banner inicial se excluye." >> "$GITHUB_STEP_SUMMARY"
          echo "Las referencias se formatean a doble espacio, con sangría francesa de 0.5 pulgadas y orden alfabético cuando está activado." >> "$GITHUB_STEP_SUMMARY"
          echo "DOI y URL existentes se normalizan de forma conservadora y se preservan cursivas existentes; no se inventan datos bibliográficos faltantes." >> "$GITHUB_STEP_SUMMARY"
