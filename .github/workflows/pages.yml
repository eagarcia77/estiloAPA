name: Validate and publish APA7 Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check module-profile.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify required files and APA strict profile
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f enhancements.js
          test -f pdf-smart.js
          test -f module-profile.js
          test -f html-enhance.js
          test -f docx-enhance.js
          grep -q 'id="formatProfile"' index.html
          grep -q 'module-profile.js' index.html
          grep -q 'html-enhance.js' index.html
          grep -q 'docx-enhance.js' index.html
          grep -q 'v2.5' index.html
          grep -q 'apa-heading-level-1' module-profile.js
          grep -q 'apa7-strict-table' module-profile.js
          grep -q 'DOCX_ENHANCE_VERSION = "2.5"' docx-enhance.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Formatter v2.5 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Headings APA 7 por nivel, tablas APA sin líneas verticales y exportación DOCX/HTML validados." >> "$GITHUB_STEP_SUMMARY"
