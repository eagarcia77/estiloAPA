name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify required profiles and exports
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f enhancements.js
          test -f pdf-smart.js
          test -f module-profile.js
          test -f thesis-profile.js
          test -f thesis-html.js
          test -f thesis-docx.js
          test -f html-enhance.js
          test -f docx-enhance.js
          grep -q 'id="formatProfile"' index.html
          grep -q 'thesis-doctoral' index.html
          grep -q 'thesis-masters' index.html
          grep -q 'thesis-profile.js' index.html
          grep -q 'thesis-docx.js' index.html
          grep -q 'thesis-html.js' index.html
          grep -q 'v2.6' index.html
          grep -q 'THESIS_PROFILE_VERSION = "2.6"' thesis-profile.js
          grep -q 'THESIS_DOCX_VERSION = "2.6"' thesis-docx.js
          grep -q 'THESIS_HTML_VERSION = "2.6"' thesis-html.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v2.6 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Incluye perfiles de módulo institucional, disertación doctoral, tesis de maestría y APA 7 estándar." >> "$GITHUB_STEP_SUMMARY"
          echo "Los perfiles de tesis validan TNR 12, doble espacio, margen izquierdo 1.5 pulgadas, preliminares romanos y cuerpo arábigo." >> "$GITHUB_STEP_SUMMARY"
