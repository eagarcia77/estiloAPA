name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check pdf-figure-recovery-v346.js
          node --check pdf-recovery-wait-v346.js
          node --check docx-images-v346.js
          node --check source-images-v345.js
          node --check reference-audit-v30.js
          node --check reference-format-v345.js
          node --check image-editor-v344.js
          node --check figure-apa.js
          node --check exclude-banner-v343.js
          node --check docx-figure-export-v2.js
          node --check docx-banner-safe-v343.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js

      - name: Verify v3.4.6 image recovery and APA references
        shell: bash
        run: |
          set -e
          test -f pdf-figure-recovery-v346.js
          test -f pdf-recovery-wait-v346.js
          test -f docx-images-v346.js
          test -f source-images-v345.js
          test -f reference-format-v345.js
          grep -q 'PDF_FIGURE_RECOVERY_VERSION = "3.4.6"' pdf-figure-recovery-v346.js
          grep -q 'standalone "Figura X" label is a positive' pdf-figure-recovery-v346.js
          grep -q 'pdf-recovered-v346' pdf-figure-recovery-v346.js
          grep -q 'data-apa-source-figure-number' pdf-figure-recovery-v346.js
          grep -q 'Imagen del documento original' pdf-figure-recovery-v346.js
          grep -q 'PDF_RECOVERY_WAIT_VERSION = "3.4.6"' pdf-recovery-wait-v346.js
          grep -q '45000' pdf-recovery-wait-v346.js
          grep -q 'DOCX_IMAGES_VERSION = "3.4.6"' docx-images-v346.js
          grep -q 'mammoth.images.imgElement' docx-images-v346.js
          grep -q 'image.read("base64")' docx-images-v346.js
          grep -q 'REFERENCE_FORMAT_VERSION = "3.4.5"' reference-format-v345.js
          grep -q 'paddingLeft = ".5in"' reference-format-v345.js
          grep -q 'textIndent = "-.5in"' reference-format-v345.js
          grep -q 'lineHeight = "2"' reference-format-v345.js
          grep -q 'https://doi.org/' reference-format-v345.js
          grep -q 'DOCX_BANNER_SAFE_VERSION = "3.4.6"' docx-banner-safe-v343.js
          grep -q 'recoverPdfFiguresV346' docx-banner-safe-v343.js
          grep -q 'docx-images-v346.js' html-enhance.js
          grep -q 'pdf-figure-recovery-v346.js' html-enhance.js
          grep -q 'pdf-recovery-wait-v346.js' html-enhance.js
          grep -q 'HTML_ENHANCE_VERSION = "3.4.6"' html-enhance.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.6 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "DOCX: Mammoth importa las imágenes incrustadas antes de convertir el documento." >> "$GITHUB_STEP_SUMMARY"
          echo "PDF: Figura X ahora activa la recuperación de la imagen en vez de bloquearla." >> "$GITHUB_STEP_SUMMARY"
          echo "El exportador espera a que termine la recuperación de figuras antes de crear Word/HTML." >> "$GITHUB_STEP_SUMMARY"
          echo "El banner inicial se excluye y las referencias conservan el formateo APA 7 de v3.4.5." >> "$GITHUB_STEP_SUMMARY"
