name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check pdf-figure-recovery-v347.js
          node --check docx-images-v346.js
          node --check source-images-v345.js
          node --check reference-audit-v30.js
          node --check reference-format-v345.js
          node --check image-editor-v344.js
          node --check figure-apa.js
          node --check exclude-banner-v343.js
          node --check docx-figure-export-v2.js
          node --check docx-banner-safe-v343.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js

      - name: Verify v3.4.7 image recovery and APA references
        shell: bash
        run: |
          set -e
          test -f pdf-figure-recovery-v347.js
          test -f docx-images-v346.js
          test -f source-images-v345.js
          test -f reference-format-v345.js
          grep -q 'PDF_FIGURE_RECOVERY_VERSION = "3.4.7"' pdf-figure-recovery-v347.js
          grep -q 'pfrSplitBrParagraph' pdf-figure-recovery-v347.js
          grep -q 'trailing: true' pdf-figure-recovery-v347.js
          grep -q 'pfrPageHasImage' pdf-figure-recovery-v347.js
          grep -q 'paintImageXObject' pdf-figure-recovery-v347.js
          grep -q 'pdf-recovered-v347' pdf-figure-recovery-v347.js
          grep -q 'apa-self-captioned-figure' pdf-figure-recovery-v347.js
          grep -q 'apaSelfCaptioned = "true"' pdf-figure-recovery-v347.js
          grep -q 'data-apa-source-figure-number' pdf-figure-recovery-v347.js
          grep -q 'pageNumber === 1' pdf-figure-recovery-v347.js
          grep -q 'introduccion' pdf-figure-recovery-v347.js
          grep -q 'DOCX_IMAGES_VERSION = "3.4.6"' docx-images-v346.js
          grep -q 'mammoth.images.imgElement' docx-images-v346.js
          grep -q 'image.read("base64")' docx-images-v346.js
          grep -q 'REFERENCE_FORMAT_VERSION = "3.4.5"' reference-format-v345.js
          grep -q 'paddingLeft = ".5in"' reference-format-v345.js
          grep -q 'textIndent = "-.5in"' reference-format-v345.js
          grep -q 'lineHeight = "2"' reference-format-v345.js
          grep -q 'https://doi.org/' reference-format-v345.js
          grep -q 'DOCX_BANNER_SAFE_VERSION = "3.4.7"' docx-banner-safe-v343.js
          grep -q 'recoverPdfFiguresV347' docx-banner-safe-v343.js
          grep -q 'docx-images-v346.js' html-enhance.js
          grep -q 'pdf-figure-recovery-v347.js' html-enhance.js
          if grep -q 'pdf-figure-recovery-v346.js' html-enhance.js; then echo 'v3.4.7 must not load the obsolete v3.4.6 PDF recovery module' >&2; exit 1; fi
          grep -q 'HTML_ENHANCE_VERSION = "3.4.7"' html-enhance.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.7 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "PDF: la recuperación entiende páginas importadas como un solo párrafo con saltos BR y divide el bloque en la posición real de la figura." >> "$GITHUB_STEP_SUMMARY"
          echo "PDF: también se recuperan figuras ubicadas después de la última línea de una página y se filtran páginas sin objetos de imagen." >> "$GITHUB_STEP_SUMMARY"
          echo "Las figuras con Figura X, título y Nota integrados se preservan como una sola imagen sin duplicar caption; el banner inicial se excluye." >> "$GITHUB_STEP_SUMMARY"
          echo "DOCX mantiene importación de imágenes incrustadas antes de Mammoth y referencias APA 7 conservadoras." >> "$GITHUB_STEP_SUMMARY"
