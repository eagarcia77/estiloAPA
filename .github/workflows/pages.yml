name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check reference-audit-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify APA 7 editor, reference audit, tables and thesis safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f apa-editor-v30.js
          test -f reference-audit-v30.js
          test -f apa-table-v29.js
          test -f thesis-docx.js
          grep -q 'v3.0' index.html
          grep -q 'apa-editor-v30.js' index.html
          grep -q 'reference-audit-v30.js' index.html
          grep -q 'APA_EDITOR_VERSION = "3.0"' apa-editor-v30.js
          grep -q 'APA_REFERENCE_AUDIT_VERSION = "3.0"' reference-audit-v30.js
          grep -q 'Encabezado nivel 5' apa-editor-v30.js
          grep -q 'Francesa .5' apa-editor-v30.js
          grep -q 'Párrafo APA' apa-editor-v30.js
          grep -q 'https://doi.org' reference-audit-v30.js
          grep -q 'orden alfabético' reference-audit-v30.js
          grep -q 'sangría francesa' reference-audit-v30.js
          grep -q 'doble espacio' reference-audit-v30.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'borderLeft = "0"' apa-table-v29.js
          grep -q 'AlignmentType.LEFT' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.0 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Vista previa incluye barra de edición con presets y reglas APA 7, encabezados 1–5, sangrías, interlineado, tabla, figura, enlace y salto de página." >> "$GITHUB_STEP_SUMMARY"
          echo "La auditoría revisa individualmente referencias: autor/fecha, DOI/URL, cursivas, sangría francesa, doble espacio y orden alfabético." >> "$GITHUB_STEP_SUMMARY"
