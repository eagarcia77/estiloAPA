name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify APA 7 tables and thesis safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f apa-table-v29.js
          test -f thesis-docx.js
          grep -q 'v2.9' index.html
          grep -q 'apa-table-v29.js' index.html
          grep -q 'APA_TABLE_VERSION = "2.9"' apa-table-v29.js
          grep -q 'THESIS_DOCX_VERSION = "2.9"' thesis-docx.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'borderLeft = "0"' apa-table-v29.js
          grep -q 'borderRight = "0"' apa-table-v29.js
          grep -q 'Tabla ${tableNumber}' apa-table-v29.js
          grep -q 'Concepto' apa-table-v29.js
          grep -q 'AlignmentType.LEFT' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v2.9 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Las tablas eliminan líneas verticales y cuadrícula completa; conservan solo reglas horizontales APA 7." >> "$GITHUB_STEP_SUMMARY"
          echo "Se añaden número en negrita, título en cursiva y recuperación adicional de tablas de dos columnas." >> "$GITHUB_STEP_SUMMARY"
