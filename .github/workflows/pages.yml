name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify required profiles and thesis structure safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f enhancements.js
          test -f pdf-smart.js
          test -f module-profile.js
          test -f thesis-profile.js
          test -f thesis-html.js
          test -f thesis-docx.js
          test -f html-enhance.js
          test -f docx-enhance.js
          grep -q 'id="formatProfile"' index.html
          grep -q 'thesis-doctoral' index.html
          grep -q 'thesis-masters' index.html
          grep -q 'v2.7' index.html
          grep -q 'THESIS_PROFILE_VERSION = "2.7"' thesis-profile.js
          grep -q 'THESIS_DOCX_VERSION = "2.7"' thesis-docx.js
          grep -q 'THESIS_HTML_VERSION = "2.7"' thesis-html.js
          grep -q 'module-like' thesis-profile.js
          grep -q 'body-only' thesis-docx.js
          grep -q 'firstPrelimIndex' thesis-docx.js
          grep -q 'pageNumbers: { start: 1' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v2.7 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Corrige la clasificación de documentos sin Capítulo I y evita convertir módulos completos en preliminares romanos." >> "$GITHUB_STEP_SUMMARY"
          echo "Preliminares usan romanos solo cuando se detectan; el cuerpo académico o Capítulo I inicia en 1 arábigo." >> "$GITHUB_STEP_SUMMARY"