name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check reference-audit-v30.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check figure-apa.js
          node --check exclude-banner-v343.js
          node --check docx-figure-export-v2.js
          node --check docx-banner-safe-v343.js

      - name: Verify v3.4.3 figures and banner-safe export
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f pdf-original-media-v33.js
          test -f figure-apa.js
          test -f exclude-banner-v343.js
          test -f docx-figure-export-v2.js
          test -f docx-banner-safe-v343.js
          grep -q 'PDF_ORIGINAL_MEDIA_VERSION = "3.4"' pdf-original-media-v33.js
          grep -q 'data-apa-self-captioned' pdf-original-media-v33.js
          grep -q 'apaMediaRole = "module-banner"' pdf-original-media-v33.js
          grep -q 'apaMediaRole = "self-captioned-figure"' pdf-original-media-v33.js
          grep -q 'apaMediaRole = "unclassified"' pdf-original-media-v33.js
          grep -q 'BANNER_EXCLUDE_VERSION = "3.4.3"' exclude-banner-v343.js
          grep -q 'apaExcludeExport = "true"' exclude-banner-v343.js
          grep -q 'apa-start-banner-excluded' exclude-banner-v343.js
          grep -q 'display:none !important' exclude-banner-v343.js
          if grep -q 'img.remove()' exclude-banner-v343.js; then echo 'v3.4.3 must not remove media from the live preview' >&2; exit 1; fi
          grep -q 'DOCX_BANNER_SAFE_VERSION = "3.4.3"' docx-banner-safe-v343.js
          grep -q 'detachTrueBanners' docx-banner-safe-v343.js
          grep -q 'restoreTrueBanners' docx-banner-safe-v343.js
          grep -q 'exclude-banner-v343.js' html-enhance.js
          grep -q 'docx-banner-safe-v343.js' html-enhance.js
          grep -q 'HTML_ENHANCE_VERSION = "3.4.3"' html-enhance.js
          grep -q 'data-apa-media-role="module-banner"' html-enhance.js
          grep -q 'APA_LIST_VERSION = "3.1"' list-normalizer-v31.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.3 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Se preserva el motor de imágenes PDF v3.4 y no se eliminan imágenes del DOM activo." >> "$GITHUB_STEP_SUMMARY"
          echo "Solo el banner real de inicio (module-banner, página 1) se oculta en la vista formateada." >> "$GITHUB_STEP_SUMMARY"
          echo "Las figuras académicas permanecen visibles y se exportan; el banner se omite únicamente en las copias HTML/DOCX." >> "$GITHUB_STEP_SUMMARY"
