name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify required profiles and thesis alignment safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f thesis-profile.js
          test -f thesis-alignment.js
          test -f thesis-html.js
          test -f thesis-docx.js
          grep -q 'v2.8' index.html
          grep -q 'thesis-alignment.js' index.html
          grep -q 'THESIS_ALIGNMENT_VERSION = "2.8"' thesis-alignment.js
          grep -q 'THESIS_DOCX_VERSION = "2.8"' thesis-docx.js
          grep -q 'THESIS_HTML_VERSION = "2.8"' thesis-html.js
          grep -q 'AlignmentType.LEFT' thesis-docx.js
          grep -q 'sectionRole = "body"' thesis-docx.js
          grep -q 'text-align: left' thesis-alignment.js
          grep -q 'module-like' thesis-profile.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v2.8 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Los párrafos de contenido en perfiles de maestría y doctorado se fuerzan a alineación izquierda en vista previa, DOCX y HTML." >> "$GITHUB_STEP_SUMMARY"
          echo "Solo portada real y encabezados institucionales correspondientes conservan alineación centrada." >> "$GITHUB_STEP_SUMMARY"
