name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check edit-stability-v348.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check word-ribbon.js
          node --check word-editor-tools.js
          node --check word-docx-styles.js
          node --check word-local-drafts.js
          node --check simple-workspace.js
          node --check ui-english.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check pdf-original-media-v33.js
          node --check pdf-figure-recovery-v347.js
          node --check docx-images-v346.js
          node --check source-images-v345.js
          node --check reference-audit-v30.js
          node --check reference-format-v345.js
          node --check image-editor-v344.js
          node --check figure-apa.js
          node --check exclude-banner-v343.js
          node --check docx-figure-export-v2.js
          node --check docx-banner-safe-v343.js
          node --check html-enhance.js
          node --check docx-enhance.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js

      - name: Test Word-style ribbon behavior
        run: |
          node --test tests/word-ribbon.test.cjs tests/ui-english.test.cjs tests/editor-ribbon-audit.test.cjs tests/responsive-workspace.test.cjs tests/simple-workspace.test.cjs tests/no-indent-persistence.test.cjs tests/no-automatic-restyling.test.cjs tests/auto-apa-import.test.cjs tests/review-panel-close.test.cjs tests/on-demand-review.test.cjs tests/editor-cleanup.test.cjs tests/word-editor-tools.test.cjs tests/word-docx-styles.test.cjs tests/word-local-drafts.test.cjs

      - name: Verify v3.4.8 protected editing and local installation files
        shell: bash
        run: |
          set -e
          test -f edit-stability-v348.js
          test -f INSTALACION_SERVIDOR_LOCAL.md
          test -f run-local.bat
          test -f run-local.ps1
          grep -q 'APA_EDIT_STABILITY_VERSION = "3.4.8"' edit-stability-v348.js
          grep -q 'apaShouldDeferNormalization' edit-stability-v348.js
          grep -q 'aesLooksLikeNormalization' edit-stability-v348.js
          grep -q 'aesPendingNormalizations' edit-stability-v348.js
          grep -q 'normalizeMedia' edit-stability-v348.js
          grep -q 'normalizeNumberedLists' edit-stability-v348.js
          grep -q 'applyModuleProfile' edit-stability-v348.js
          grep -q 'applyApaFigureFormatting' edit-stability-v348.js
          grep -q 'formatReferencesApa7' edit-stability-v348.js
          grep -q 'recoverPdfFiguresV34' edit-stability-v348.js
          grep -q 'edit-stability-v348.js' index.html
          grep -q 'lang="en"' index.html
          grep -q 'id="simpleReviewDetails"' index.html
          grep -q 'PDF_FIGURE_RECOVERY_VERSION = "3.4.7"' pdf-figure-recovery-v347.js
          grep -q 'DOCX_IMAGES_VERSION = "3.4.6"' docx-images-v346.js
          grep -q 'REFERENCE_FORMAT_VERSION = "3.4.5"' reference-format-v345.js
          grep -q 'APA7 Academic Formatter v3.4.8' run-local.bat
          grep -q 'APA7 Academic Formatter v3.4.8' run-local.ps1
          grep -q 'XAMPP / Apache' INSTALACION_SERVIDOR_LOCAL.md
          grep -q 'Microsoft IIS' INSTALACION_SERVIDOR_LOCAL.md

      - name: Build complete v3.4.8 source ZIP
        shell: bash
        run: |
          set -e
          git archive \
            --format=zip \
            --prefix=APA7-Academic-Formatter-v3.4.8/ \
            --output=APA7-Academic-Formatter-v3.4.8-completo.zip \
            "$GITHUB_SHA"
          unzip -l APA7-Academic-Formatter-v3.4.8-completo.zip | head -80

      - name: Upload complete source package
        uses: actions/upload-artifact@v4
        with:
          name: APA7-Academic-Formatter-v3.4.8-completo
          path: APA7-Academic-Formatter-v3.4.8-completo.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish gh-pages branch and downloadable ZIP
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PACKAGE="$RUNNER_TEMP/APA7-Academic-Formatter-v3.4.8-completo.zip"
          cp APA7-Academic-Formatter-v3.4.8-completo.zip "$PACKAGE"

          git branch -f gh-pages "$GITHUB_SHA"
          git switch gh-pages
          mkdir -p downloads
          cp "$PACKAGE" downloads/APA7-Academic-Formatter-v3.4.8-completo.zip
          git add downloads/APA7-Academic-Formatter-v3.4.8-completo.zip
          git commit -m "publish: paquete completo v3.4.8" || true
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.4.8 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "APA 7 formatting is applied on import; the editor remains user-controlled." >> "$GITHUB_STEP_SUMMARY"
          echo "Deferred automatic normalizers are discarded after editing; academic review is on demand." >> "$GITHUB_STEP_SUMMARY"
          echo "DOCX/PDF image preservation, editable APA 7 references and document export remain available." >> "$GITHUB_STEP_SUMMARY"
          echo "Complete versioned source ZIP and local installation instructions are included." >> "$GITHUB_STEP_SUMMARY"
          echo "Descarga web: /downloads/APA7-Academic-Formatter-v3.4.8-completo.zip" >> "$GITHUB_STEP_SUMMARY"
