name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check reference-audit-v30.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify v3.1 lists, scrollbar, editor and APA safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f list-normalizer-v31.js
          test -f scrollbar-v31.css
          test -f apa-editor-v30.js
          test -f reference-audit-v30.js
          test -f apa-table-v29.js
          test -f thesis-docx.js
          test -f docx-enhance.js
          grep -q 'v3.1' index.html
          grep -q 'list-normalizer-v31.js' index.html
          grep -q 'scrollbar-v31.css' index.html
          grep -q 'APA_LIST_VERSION = "3.1"' list-normalizer-v31.js
          grep -q 'window.normalizeNumberedLists' list-normalizer-v31.js
          grep -q 'max-height: 72vh' scrollbar-v31.css
          grep -q 'overflow-y: scroll' scrollbar-v31.css
          grep -q 'DOCX_ENHANCE_VERSION = "3.1"' docx-enhance.js
          grep -q 'apa-numbering-v31-' docx-enhance.js
          grep -q 'numberingConfigs.push' docx-enhance.js
          grep -q 'THESIS_DOCX_VERSION = "3.1"' thesis-docx.js
          grep -q 'thesis-numbering-v31-' thesis-docx.js
          grep -q 'numberingState.configs' thesis-docx.js
          grep -q 'APA_EDITOR_VERSION = "3.0"' apa-editor-v30.js
          grep -q 'APA_REFERENCE_AUDIT_VERSION = "3.0"' reference-audit-v30.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.1 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Cada lista numerada independiente reinicia en 1 al exportarse a Word; también se recuperan elementos numerados que quedaron como párrafos sueltos." >> "$GITHUB_STEP_SUMMARY"
          echo "Vista previa y exportación incorpora un área desplazable con scrollbar vertical visible y controles de edición fuera del scroll." >> "$GITHUB_STEP_SUMMARY"
