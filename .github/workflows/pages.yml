name: Validate and publish APA7 Academic Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js
          node --check apa-table-v29.js
          node --check module-profile.js
          node --check thesis-profile.js
          node --check thesis-alignment.js
          node --check apa-editor-v30.js
          node --check list-normalizer-v31.js
          node --check table-figure-v32.js
          node --check reference-audit-v30.js
          node --check apa-editor-export-v30.js
          node --check thesis-html.js
          node --check thesis-docx.js
          node --check html-enhance.js
          node --check docx-enhance.js

      - name: Verify v3.2 tables, figures, lists and APA safeguards
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f table-figure-v32.js
          test -f list-normalizer-v31.js
          test -f scrollbar-v31.css
          test -f apa-editor-v30.js
          test -f reference-audit-v30.js
          test -f thesis-docx.js
          test -f docx-enhance.js
          grep -q 'v3.2' index.html
          grep -q 'table-figure-v32.js' index.html
          grep -q 'APA_MEDIA_VERSION = "3.2"' table-figure-v32.js
          grep -q 'fontWeight = "400"' table-figure-v32.js
          grep -q 'fontStyle = "italic"' table-figure-v32.js
          grep -q 'apa-figure-image' table-figure-v32.js
          grep -q 'Título de la figura \[revisar\]' table-figure-v32.js
          grep -q 'window.normalizeApaMedia' table-figure-v32.js
          grep -q 'APA_LIST_VERSION = "3.1"' list-normalizer-v31.js
          grep -q 'max-height: 72vh' scrollbar-v31.css
          grep -q 'DOCX_ENHANCE_VERSION = "3.1"' docx-enhance.js
          grep -q 'apa-numbering-v31-' docx-enhance.js
          grep -q 'THESIS_DOCX_VERSION = "3.1"' thesis-docx.js
          grep -q 'thesis-numbering-v31-' thesis-docx.js
          grep -q 'insideVertical: none' thesis-docx.js
          grep -q 'left: 2160' thesis-docx.js
          grep -q 'LOWER_ROMAN' thesis-docx.js

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages "$GITHUB_SHA"
          git push --force origin gh-pages

      - name: Publication summary
        run: |
          echo "### APA7 Academic Formatter v3.2 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Los títulos de tabla se fuerzan a alineación izquierda, cursiva y peso normal, evitando que un título como Integración de conceptos herede un heading centrado/negrita." >> "$GITHUB_STEP_SUMMARY"
          echo "Las imágenes que llegan desde DOCX/PDF se conservan como figuras APA 7, con número, título, texto alternativo y preservación de Nota existente; el DOCX vuelve a insertar las imágenes." >> "$GITHUB_STEP_SUMMARY"
          echo "Se mantienen las correcciones v3.1 de listas numeradas y scrollbar de vista previa." >> "$GITHUB_STEP_SUMMARY"
