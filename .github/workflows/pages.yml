name: Validate and publish APA7 Formatter

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apa7-publish"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check pdf-smart.js

      - name: Verify required files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f enhancements.js
          test -f pdf-smart.js
          grep -q 'id="demoBtn"' index.html
          grep -q 'enhancements.js' index.html
          grep -q 'pdf-smart.js' index.html
          grep -q 'APA7 Module Formatter' index.html

      - name: Prepare static site
        shell: bash
        run: |
          set -e
          rm -rf /tmp/apa7-site
          mkdir -p /tmp/apa7-site
          cp index.html styles.css app.js enhancements.js pdf-smart.js /tmp/apa7-site/
          touch /tmp/apa7-site/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -a /tmp/apa7-site/. .
          git add -A
          git commit -m "Publish APA7 Formatter ${GITHUB_SHA::7}"
          git push --force origin gh-pages

      - name: Publication summary
        shell: bash
        run: |
          echo "### APA7 Formatter v2.2 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "La aplicación fue validada, incluyendo **PDF Smart**, y la rama **gh-pages** fue actualizada." >> "$GITHUB_STEP_SUMMARY"
          echo "Si GitHub Pages todavía no está habilitado, seleccione **Settings → Pages → Deploy from a branch → gh-pages / root** una sola vez." >> "$GITHUB_STEP_SUMMARY"